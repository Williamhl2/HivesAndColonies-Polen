name: Release to CurseForge

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find JAR
        id: find_jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v '\-sources\.' | grep -v '\-javadoc\.' | head -1)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CF_PROJECT_ID }}
          curseforge-token: ${{ secrets.CF_API_TOKEN }}

          files: ${{ steps.find_jar.outputs.jar }}

          name: "Hives & Colonies: Characters ${{ github.ref_name }}"
          version: ${{ github.ref_name }}
          version-type: beta

          changelog-file: CHANGELOG.md

          game-versions: |
            1.21.1
          loaders: |
            neoforge
          java: 21

          retry-attempts: 2
          retry-delay: 15000