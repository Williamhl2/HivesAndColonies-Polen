name: Release to CurseForge

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # CurseForge project numeric ID - set this to your CurseForge project ID
          curseforge-id: ${{ secrets.CF_PROJECT_ID }}
          curseforge-token: ${{ secrets.CF_API_TOKEN }}

          # The built JAR artifact
          files: build/libs/!(*-@(sources|javadoc)).jar

          name: Hives & Colonies Characters ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: beta

          changelog-file: CHANGELOG.md

          game-versions: 1.21.1
          game-version-filter: releases
          loaders: neoforge
          java: 21